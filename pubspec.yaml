name: money_tracker
description: "纯本地 Android 个人记账应用。"
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  go_router: ^18.0.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  path_provider: ^2.1.6
  # path_provider_android 2.3.x pulls in JNI, which requires SDK 35.
  # This version uses the project's existing flutter.compileSdkVersion.
  path_provider_android: 2.2.23
  path: ^1.9.1
  shared_preferences: ^2.5.5
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  sqlite3: ^3.5.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png

flutter:
  uses-material-design: true
